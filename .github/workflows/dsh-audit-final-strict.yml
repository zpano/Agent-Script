name: Strict final DSH audit rows 1-2000

on:
  push:
    branches:
      - dsh-audit-1-2000-output
    paths:
      - audit-output-final-rescued/dsh_plugins_security_audit_1_2000_findings.json
      - audit-output-final-rescued/dsh_plugins_security_audit_1_2000_summary.json

permissions:
  contents: write

concurrency:
  group: dsh-audit-1-2000-strict-final
  cancel-in-progress: false

jobs:
  strict-final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dsh-audit-1-2000-output
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply strict postfilter and rebuild the exact 2000-row report
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile audit/finalize.py audit/postfilter.py
          rm -rf final-strict
          mkdir -p final-strict
          python audit/postfilter.py \
            --findings audit-output-final-rescued/dsh_plugins_security_audit_1_2000_findings.json \
            --coverage audit-output-final-rescued/dsh_plugins_security_audit_1_2000_coverage.csv \
            --review-summary audit-output-final-rescued/dsh_plugins_security_audit_1_2000_summary.json \
            --source-summary audit-output-v2/dsh_plugins_audit_1_2000_summary.json \
            --source-review audit-output-final-rescued/dsh_plugins_security_audit_1_2000_source_review.json \
            --rescue-summary audit-output-final-rescued/dsh_plugins_audit_1_2000_rescue_summary.json \
            --output-dir final-strict
      - name: Hard validation and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('final-strict')
          s=json.loads((p/'dsh_plugins_security_audit_1_2000_summary.json').read_text(encoding='utf-8'))
          assert s['target_count']==2000
          assert sum(s['verdict_counts'].values())==2000
          assert s['rescue_pass']['missing_rescue_result_count']==0
          assert s['rescue_pass']['validation_errors']==[]
          with (p/'dsh_plugins_security_audit_1_2000_coverage.csv').open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2000
          assert [int(x['row']) for x in rows]==list(range(1,2001))
          assert len({x['url'].rstrip('/').lower() for x in rows})==2000
          report=(p/'dsh_plugins_security_audit_1_2000_final.md').read_text(encoding='utf-8')
          assert '严格误报抑制' in report
          assert '完整覆盖清单（2000/2000）' in report
          PY
          python -m zipfile -c \
            final-strict/dsh_plugins_security_audit_1_2000_final.zip \
            final-strict/dsh_plugins_security_audit_1_2000_final.md \
            final-strict/dsh_plugins_security_audit_1_2000_coverage.csv \
            final-strict/dsh_plugins_security_audit_1_2000_findings.json \
            final-strict/dsh_plugins_security_audit_1_2000_summary.json \
            final-strict/dsh_plugins_security_audit_1_2000_source_review.json \
            final-strict/dsh_plugins_audit_1_2000_rescue_summary.json
      - name: Commit strict final report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output-final-strict
          cp final-strict/* audit-output-final-strict/
          printf '%s\n' "$GITHUB_RUN_ID" > audit-output-final-strict/final-run-id.txt
          git config user.name 'dsh audit strict finalizer'
          git config user.email 'actions@github.com'
          git add audit-output-final-strict/
          git diff --cached --quiet || git commit -m 'audit-output: strict final DSH rows 1-2000 report'
          git pull --rebase origin dsh-audit-1-2000-output
          git push origin HEAD:dsh-audit-1-2000-output
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugins-security-audit-1-2000-strict-final
          path: final-strict/
          retention-days: 2
          if-no-files-found: error
