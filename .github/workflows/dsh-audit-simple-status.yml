name: Direct DSH audit status snapshot

on:
  push:
    branches:
      - dsh-audit-1-2000-output
    paths:
      - audit/simple-live-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dsh-audit-1-2000-output
          fetch-depth: 0
      - name: Query audit runs and commit status JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "DSH static audit rows 1-2000" \
            --branch "chatgpt/dsh-audit-1-2000-20260818" \
            --event pull_request \
            --limit 30 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url \
            > audit-output/live-status.json
          git config user.name "dsh audit status"
          git config user.email "actions@github.com"
          git add audit-output/live-status.json
          git commit -m "audit-output: direct workflow status snapshot"
          git pull --rebase origin dsh-audit-1-2000-output
          git push origin HEAD:dsh-audit-1-2000-output
